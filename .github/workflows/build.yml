name: Build GKI

on:
  workflow_call:
    inputs:
      TODO:
        type: string
      KSU:
        type: string
      KSU_SUSFS:
        type: string
      KSU_MANUAL_HOOK:
        type: string
      LAST_BUILD:
        type: string
      KERNEL_VERSION:
        type: string
      STATUS:
        type: string

  workflow_dispatch:
    inputs:
      TODO:
        description: To do
        default: "kernel"
        type: choice
        options:
          - "kernel"
          - "defconfig"

      KSU:
        description: KernelSU Type
        default: "resukisu"
        type: choice
        options:
          - "no"
          - "yes"
          - "resukisu"
      KSU_SUSFS:
        description: Include SUSFS?
        default: "yes"
        type: choice
        options:
          - "true"
          - "false"

      KSU_MANUAL_HOOK:
        description: Use KSU Manual Hooks?
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

      KERNEL_VERSION:
        description: Which kernel version do you want to build?
        default: "6.6"
        type: choice
        options:
          - "6.6"
          - "6.1"
          - "5.10"

env:
  MAN_DISABLE: true
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    runs-on: ubuntu-24.04  # Use latest Ubuntu for better toolchain support
    timeout-minutes: 360   # 6 hour timeout (GitHub Actions limit)

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache-${{ inputs.KERNEL_VERSION }}-${{ inputs.KSU }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ inputs.KERNEL_VERSION }}-
            ${{ runner.os }}-ccache-
          max-size: 2G

      - name: Cache Clang
        uses: actions/cache@v4
        id: cache-clang
        with:
          path: ${{ github.workspace }}/clang
          key: ${{ runner.os }}-clang-${{ hashFiles('build.sh') }}
          restore-keys: ${{ runner.os }}-clang-

      - name: Cache GNU Assembler
        uses: actions/cache@v4
        id: cache-gas
        with:
          path: ${{ github.workspace }}/gas
          key: ${{ runner.os }}-gas-v1
          restore-keys: |
            ${{ runner.os }}-gas-

      - name: Determine Build Status
        run: |
          if [ -n "${{ inputs.STATUS }}" ]; then
            echo "STATUS=${{ inputs.STATUS }}" >> $GITHUB_ENV
          elif [ "${{ toJson(github.event.inputs) }}" == "null" ]; then
            echo "STATUS=RELEASE" >> $GITHUB_ENV
          else
            echo "STATUS=BETA" >> $GITHUB_ENV
          fi

      - name: Validate Inputs and Secrets
        env:
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          KSU: ${{ inputs.KSU }}
          KSU_SUSFS: ${{ inputs.KSU_SUSFS }}
          KSU_MANUAL_HOOK: ${{ inputs.KSU_MANUAL_HOOK }}
        run: |
          _error() {
              echo "❌ ERROR: $*"
              let ret++
          }

          ret=0
          if [[ -z "$TG_CHAT_ID" ]]; then
            _error "Missing TG_CHAT_ID secret (Telegram Chat ID)"
          fi
          if [[ -z "$TG_BOT_TOKEN" ]]; then
            _error "Missing TG_BOT_TOKEN secret (Telegram Bot Token)"
          fi
          if [[ -z "$GH_TOKEN" ]]; then
            _error "Missing GH_TOKEN secret (GitHub PAT)"
          fi

          if [[ $KSU == "no" && $KSU_SUSFS == "true" ]]; then              _error "Cannot use SuSFS without KernelSU"
          fi
          if [[ $KSU == "no" && $KSU_MANUAL_HOOK == "true" ]]; then
            _error "Cannot use KSU Manual Hooks without KernelSU!"
          fi
          if [[ $KSU == "resukisu" && $KSU_SUSFS != "true" ]]; then
            _error "ReSukiSU build requires KSU_SUSFS to be true"
          fi

          if [[ $ret -gt 0 ]]; then
            exit $ret
          fi

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gh bc bison flex libssl-dev libelf-dev dwarves cpio \
            build-essential libncurses5-dev xz-utils libudev-dev \
            libxml2-utils xsltproc unzip p7zip-full ccache
          pip install lxml
          
          # Setup ccache environment
          export CCACHE_DIR="$HOME/.ccache"
          export CC="ccache clang"
          export CXX="ccache clang++"
          echo "CCACHE_DIR=$CCACHE_DIR" >> $GITHUB_ENV
          echo "CC=$CC" >> $GITHUB_ENV
          echo "CXX=$CXX" >> $GITHUB_ENV

      - name: Enable optimized swap
        run: |
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo fallocate -l 20G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile --priority 100
          sudo sysctl vm.swappiness=80
          sudo sysctl vm.vfs_cache_pressure=30
          free -h
          swapon --show

      - name: Run Build Script        
        env:
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          KSU: ${{ inputs.KSU }}
          KSU_SUSFS: ${{ inputs.KSU_SUSFS }}
          KSU_MANUAL_HOOK: ${{ inputs.KSU_MANUAL_HOOK }}
          LAST_BUILD: ${{ inputs.LAST_BUILD }}
          TODO: ${{ inputs.TODO }}
          STATUS: ${{ env.STATUS }}
          KVER: ${{ inputs.KERNEL_VERSION }}
          CCACHE_DIR: ${{ env.CCACHE_DIR }}
          CC: ${{ env.CC }}
          CXX: ${{ env.CXX }}
        run: |
          export GIT_CLONE_PROTECTION_ACTIVE=false
          chmod +x *.sh py/*.py
          
          # Show ccache stats before build
          ccache -s || true
          
          ./build.sh
          
          # Show ccache stats after build
          echo "=== CCACHE STATS ==="
          ccache -s || true

      - name: Upload Artifacts (ZIP & IMG)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.BASE_NAME }}-${{ github.run_number }}
          path: |
            artifacts/*.zip
            artifacts/*.img
          retention-days: 30
          compression-level: 9

      - name: Upload Artifacts (Info File)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: info-${{ github.run_number }}
          path: artifacts/*.txt
          retention-days: 30
          compression-level: 9
      - name: Upload Build Log
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          retention-days: 7

      - name: Show ccache summary
        if: always()
        run: |
          echo "=== CCACHE SUMMARY ==="
          ccache -s || true
          echo "=== CCACHE SIZE ==="
          du -sh $HOME/.ccache || true
